spring:
  application:
    name: reservas-canchas-api
  datasource:
    url: jdbc:h2:mem:reservas
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
